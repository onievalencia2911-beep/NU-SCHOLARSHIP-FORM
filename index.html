<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Happy Birthday, Mama ♥</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400;1,500&family=Great+Vibes&family=Playfair+Display:wght@600;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#fbf3ea; --cream-2:#f6e8da; --rose:#d9415f; --rose-deep:#a8324c;
    --rose-soft:#f3a5b9; --gold:#e9b85d; --ink:#5b2a35; --muted:#8c6168;
    --serif:"Playfair Display", Georgia, serif;
    --body:"Cormorant Garamond", Georgia, serif;
    --script:"Great Vibes", "Brush Script MT", cursive;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    background:var(--cream); color:var(--ink); font-family:var(--body);
    -webkit-font-smoothing:antialiased; overflow:hidden;
  }
  body.unlocked{overflow-x:hidden; overflow-y:auto}
  button{font:inherit;color:inherit}

  /* ---------- Stage 1: the heart ---------- */
  .stage{position:fixed; inset:0; display:grid; place-items:center; z-index:10}
  #intro{
    background:
      radial-gradient(circle at 50% 48%, rgba(255,214,224,.75) 0, rgba(255,226,214,.35) 18%, transparent 42%),
      var(--cream);
    transition:opacity .6s ease;
  }
  .intro-inner{display:flex; flex-direction:column; align-items:center; gap:22px; text-align:center}
  .intro-kicker{font-style:italic; font-size:clamp(18px,2.4vw,24px); color:#b0566a; letter-spacing:.02em;
    opacity:0; animation:fadeUp 1.2s .3s ease forwards}
  #heartBtn{
    position:relative; width:clamp(120px,22vw,170px); aspect-ratio:1; border:0; padding:0;
    background:none; cursor:pointer; border-radius:50%;
    animation:beat 1.6s ease-in-out infinite; -webkit-tap-highlight-color:transparent;
  }
  #heartBtn::before{ /* soft halo */
    content:""; position:absolute; inset:-60%; border-radius:50%;
    background:radial-gradient(circle, rgba(244,140,170,.45), rgba(244,170,150,.18) 40%, transparent 68%);
    z-index:-1; animation:halo 1.6s ease-in-out infinite;
  }
  #heartBtn svg{width:100%; height:100%; overflow:visible; filter:drop-shadow(0 14px 18px rgba(201,61,96,.35))}
  #heartBtn:focus-visible{outline:2px dashed var(--rose); outline-offset:10px}
  .intro-hint{font-size:15px; color:var(--muted); font-style:italic; opacity:0; animation:fadeUp 1s 1.4s ease forwards}
  #heartBtn.dropping{animation:drop .9s cubic-bezier(.55,0,.3,1) forwards}
  @keyframes beat{0%,100%{transform:scale(1)}14%{transform:scale(1.1)}28%{transform:scale(.98)}42%{transform:scale(1.06)}}
  @keyframes halo{0%,100%{opacity:.75; transform:scale(.95)}40%{opacity:1; transform:scale(1.05)}}
  @keyframes drop{
    0%{transform:scale(1)}
    25%{transform:translateY(-14px) scale(1.08)}
    70%{transform:translateY(22vh) scale(1.1,.78)}
    100%{transform:translateY(22vh) scale(1.6,.55); opacity:.0}
  }

  /* ---------- Stage 2: make a wish ---------- */
  #wish{
    --cx:50%; --cy:50%;
    background:
      radial-gradient(ellipse at 12% 18%, rgba(247,163,196,.85), transparent 45%),
      radial-gradient(ellipse at 90% 100%, rgba(150,22,52,.45), transparent 55%),
      linear-gradient(160deg, #e9566f, #d93c5b 55%, #c42f50);
    color:#fff6ef; text-align:center; cursor:pointer;
    clip-path:circle(0% at var(--cx) var(--cy)); visibility:hidden;
    transition:clip-path 1.1s cubic-bezier(.7,0,.2,1);
  }
  #wish.open{clip-path:circle(150% at var(--cx) var(--cy)); visibility:visible}
  .wish-inner{padding:24px}
  .wish-kicker{font-style:italic; font-size:clamp(18px,2.6vw,26px); letter-spacing:.06em; opacity:.9}
  .wish-title{font-family:var(--serif); font-weight:800; font-size:clamp(64px,14vw,168px); line-height:.9; margin:.12em 0 0;
    text-shadow:0 6px 30px rgba(120,10,40,.25)}
  .wish-title span{display:block}
  .swoosh{width:min(420px,70vw); height:40px; margin:6px auto 0; display:block}
  .swoosh path{stroke-dasharray:520; stroke-dashoffset:520}
  .wish-sub{font-style:italic; font-size:clamp(20px,3vw,30px); margin-top:8px}
  .wish-tap{position:absolute; left:0; right:0; bottom:max(28px, env(safe-area-inset-bottom)); font-size:15px; font-style:italic; opacity:0}
  #wish .reveal{opacity:0; transform:translateY(18px)}
  #wish.play .reveal{animation:fadeUp 1s ease forwards}
  #wish.play .swoosh path{animation:draw 1.3s 1.5s ease forwards}
  #wish.play .wish-tap{animation:fadeIn 1s 3s ease forwards, pulse 2.4s 4s ease-in-out infinite}
  @keyframes draw{to{stroke-dashoffset:0}}
  @keyframes pulse{0%,100%{opacity:.85}50%{opacity:.45}}

  #flash{position:fixed; inset:0; z-index:20; pointer-events:none; opacity:0;
    background:radial-gradient(circle at 50% 45%, #fffdf8, #fbefe2 70%); transition:opacity .5s ease}
  #flash.on{opacity:1}
  #flash.fade{transition:opacity 1.1s ease}

  /* ---------- Main page ---------- */
  #petals{position:fixed; inset:0; width:100%; height:100%; z-index:0; pointer-events:none}
  #main{position:relative; z-index:1; display:none;
    background:
      radial-gradient(ellipse at 85% 10%, rgba(248,200,214,.45), transparent 40%),
      radial-gradient(ellipse at 0% 70%, rgba(250,222,190,.5), transparent 45%);
  }
  body.unlocked #main{display:block}
  .topbar{position:sticky; top:0; z-index:5; text-align:center; padding:14px 16px 12px;
    font-family:var(--serif); font-weight:600; color:var(--rose-deep); font-size:17px; letter-spacing:.01em;
    background:rgba(251,243,234,.72); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
    border-bottom:1px solid rgba(168,50,76,.08)}

  .hero{min-height:calc(100svh - 48px); display:grid; grid-template-columns:1fr 1.15fr; align-items:end;
    max-width:1180px; margin:0 auto; padding:10px 28px 40px; position:relative}
  .hero-script{padding-bottom:6vh; opacity:0; transform:translateY(16px); transition:opacity 1.4s ease, transform 1.4s ease}
  .hero-script.show{opacity:1; transform:none}
  .hero-script .kicker{font-style:italic; font-size:22px; color:var(--muted)}
  .hero-script h2{font-family:var(--script); font-weight:400; color:var(--rose); margin:0; line-height:.95;
    font-size:clamp(64px,9vw,120px); text-shadow:0 2px 0 rgba(255,255,255,.6)}
  .hero-script .to{font-style:italic; font-size:26px; margin-top:6px; color:var(--ink)}
  .tree-wrap{display:flex; justify-content:center; align-items:flex-end}
  #tree{width:min(560px, 46vw); height:auto; aspect-ratio:1/1.15; display:block}
  .scroll-cue{position:absolute; left:50%; bottom:14px; transform:translateX(-50%); font-style:italic; color:var(--muted);
    font-size:15px; opacity:0; transition:opacity 1s ease; text-align:center}
  .scroll-cue.show{opacity:1}
  .scroll-cue i{display:block; font-style:normal; animation:bob 1.8s ease-in-out infinite}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(6px)}}

  .section{max-width:760px; margin:0 auto; padding:56px 20px}
  .section-head{text-align:center; margin-bottom:26px}
  .section-head .kicker{font-style:italic; color:var(--muted); font-size:20px}
  .section-head h3{font-family:var(--serif); font-weight:800; color:var(--rose-deep); margin:2px 0 0; font-size:clamp(30px,5vw,44px)}

  .gallery-card{background:rgba(255,255,255,.62); border-radius:22px; padding:12px;
    box-shadow:0 20px 50px -24px rgba(120,40,60,.35); backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px)}
  .grid{display:grid; grid-template-columns:repeat(3,1fr); gap:10px}
  .ph{margin:0; cursor:zoom-in; position:relative}
  .ph .frame{border-radius:14px; overflow:hidden; aspect-ratio:4/5; background:var(--cream-2)}
  .ph img{width:100%; height:100%; object-fit:cover; display:block; transition:transform .6s ease}
  .ph:hover img{transform:scale(1.04)}
  .ph figcaption{font-style:italic; font-size:15px; color:var(--muted); text-align:center; padding:6px 4px 2px; line-height:1.2}

  .letter{background:#fffdfb; border-radius:24px; padding:40px clamp(22px,6vw,64px) 44px; text-align:center;
    box-shadow:0 30px 70px -30px rgba(120,40,60,.4); border:1px solid rgba(168,50,76,.07)}
  .pill{display:inline-flex; align-items:center; gap:8px; background:#fdecef; color:var(--rose-deep);
    border-radius:999px; padding:6px 14px 6px 8px; font-size:15px; font-style:italic}
  .pill b{width:20px; height:20px; border-radius:50%; background:var(--rose); color:#fff; display:grid; place-items:center; font-size:11px; font-style:normal}
  .letter h3{font-family:var(--serif); font-weight:800; color:var(--rose-deep); font-size:clamp(28px,5vw,40px); margin:16px 0 18px}
  .letter p{font-size:clamp(19px,2.4vw,22px); font-style:italic; line-height:1.55; margin:0 0 14px; color:#5d3a40}
  .signoff{margin-top:26px}
  .signoff span{display:block; font-style:italic; font-size:19px; color:var(--muted)}
  .signoff strong{display:block; font-family:var(--script); font-weight:400; font-size:44px; color:var(--rose); line-height:1.1}

  .hug-wrap{text-align:center; padding:8px 20px 90px}
  #hugBtn{border:0; cursor:pointer; background:linear-gradient(135deg,#e8546f,#c93454); color:#fff;
    padding:15px 30px; border-radius:999px; font-size:20px; font-style:italic; font-weight:600;
    box-shadow:0 14px 30px -12px rgba(201,52,84,.7); transition:transform .2s ease}
  #hugBtn:hover{transform:translateY(-2px)}
  #hugBtn:active{transform:scale(.97)}
  .hug-note{display:block; margin-top:14px; font-style:italic; color:var(--muted); font-size:17px; min-height:1.4em}

  .reveal-up{opacity:0; transform:translateY(24px); transition:opacity .9s ease, transform .9s ease}
  .reveal-up.in{opacity:1; transform:none}

  /* music toggle */
  #musicBtn{position:fixed; right:max(16px, env(safe-area-inset-right)); bottom:max(16px, env(safe-area-inset-bottom)); z-index:30;
    width:48px; height:48px; border-radius:50%; border:0; cursor:pointer; display:none; place-items:center;
    background:rgba(255,255,255,.85); color:var(--rose); box-shadow:0 8px 24px -8px rgba(120,40,60,.45);
    backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px)}
  #musicBtn.show{display:grid}
  #musicBtn svg{width:22px; height:22px}
  #musicBtn.playing svg{animation:spin 4s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}

  /* lightbox */
  #lightbox{position:fixed; inset:0; z-index:40; background:rgba(60,20,30,.72); display:none; place-items:center; padding:24px;
    backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px)}
  #lightbox.open{display:grid}
  #lightbox figure{margin:0; max-width:min(92vw,560px); text-align:center}
  #lightbox img{max-width:100%; max-height:76vh; border-radius:16px; box-shadow:0 30px 60px rgba(0,0,0,.35); background:#fff}
  #lightbox figcaption{color:#fff3ee; font-style:italic; font-size:20px; margin-top:12px}
  #lightbox button{position:absolute; top:16px; right:16px; width:44px; height:44px; border-radius:50%; border:0;
    background:rgba(255,255,255,.9); color:var(--rose-deep); font-size:22px; cursor:pointer}

  .fly{position:fixed; pointer-events:none; z-index:50; font-size:20px; line-height:1; will-change:transform,opacity}

  @keyframes fadeUp{from{opacity:0; transform:translateY(18px)}to{opacity:1; transform:none}}
  @keyframes fadeIn{to{opacity:1}}

  @media (max-width:760px){
    .hero{grid-template-columns:1fr; align-items:start; padding:6px 18px 70px; text-align:center}
    .tree-wrap{order:1}
    .hero-script{order:2; padding-bottom:0; margin-top:-10px}
    #tree{width:min(420px, 88vw)}
    .grid{grid-template-columns:repeat(2,1fr)}
    .section{padding:44px 16px}
  }
  @media (prefers-reduced-motion:reduce){
    #heartBtn, #heartBtn::before{animation:none}
  }
</style>
</head>
<body>

<!-- Stage 1: tap the heart -->
<section id="intro" class="stage" aria-label="Start">
  <div class="intro-inner">
    <div class="intro-kicker" id="introText"></div>
    <button id="heartBtn" aria-label="Open your birthday surprise">
      <svg viewBox="-60 -56 120 112" aria-hidden="true">
        <defs>
          <radialGradient id="hg" cx="38%" cy="30%" r="80%">
            <stop offset="0" stop-color="#ffc1d0"/>
            <stop offset=".45" stop-color="#f27896"/>
            <stop offset="1" stop-color="#d23a62"/>
          </radialGradient>
          <radialGradient id="hl" cx="50%" cy="50%" r="50%">
            <stop offset="0" stop-color="#fff" stop-opacity=".95"/>
            <stop offset="1" stop-color="#fff" stop-opacity="0"/>
          </radialGradient>
        </defs>
        <path d="M0 -22 C -8 -46 -52 -48 -52 -10 C -52 16 -22 34 0 52 C 22 34 52 16 52 -10 C 52 -48 8 -46 0 -22 Z" fill="url(#hg)"/>
        <ellipse cx="-24" cy="-22" rx="15" ry="9" transform="rotate(-28 -24 -22)" fill="url(#hl)"/>
        <ellipse cx="26" cy="-28" rx="6" ry="3.5" transform="rotate(25 26 -28)" fill="#fff" opacity=".55"/>
      </svg>
    </button>
    <div class="intro-hint">tap the heart</div>
  </div>
</section>

<!-- Stage 2: make a wish -->
<section id="wish" class="stage" aria-label="Happy Birthday">
  <div class="wish-inner">
    <div class="wish-kicker reveal" style="animation-delay:.5s">make a wish…</div>
    <h1 class="wish-title"><span class="reveal" style="animation-delay:.8s">Happy</span><span class="reveal" style="animation-delay:1.1s">Birthday</span></h1>
    <svg class="swoosh" viewBox="0 0 420 40" aria-hidden="true">
      <path d="M8 26 C 90 10, 200 8, 300 18 S 400 30, 412 14" fill="none" stroke="#f3c56b" stroke-width="5" stroke-linecap="round"/>
    </svg>
    <div class="wish-sub reveal" style="animation-delay:2s" id="wishSub"></div>
  </div>
  <div class="wish-tap">tap anywhere to continue</div>
</section>

<div id="flash"></div>
<canvas id="petals" aria-hidden="true"></canvas>

<!-- Main page -->
<main id="main">
  <header class="topbar" id="topbar"></header>

  <section class="hero">
    <div class="hero-script" id="heroScript">
      <div class="kicker">and… make it count</div>
      <h2>Happy Birthday</h2>
      <div class="to" id="heroTo"></div>
    </div>
    <div class="tree-wrap"><canvas id="tree" aria-label="A tree growing hearts"></canvas></div>
    <div class="scroll-cue" id="scrollCue">scroll down<i>↓</i></div>
  </section>

  <section class="section" id="gallery">
    <div class="section-head reveal-up">
      <div class="kicker" id="galleryKicker"></div>
      <h3 id="galleryTitle"></h3>
    </div>
    <div class="gallery-card reveal-up"><div class="grid" id="grid"></div></div>
  </section>

  <section class="section">
    <article class="letter reveal-up" id="letter">
      <div class="pill"><b>♥</b>A Message for You</div>
      <h3 id="letterTitle"></h3>
      <div id="letterBody"></div>
      <div class="signoff"><span id="signoffLine"></span><strong id="signoffName"></strong></div>
    </article>
  </section>

  <div class="hug-wrap reveal-up">
    <button id="hugBtn"></button>
    <span class="hug-note" id="hugNote" aria-live="polite"></span>
  </div>
</main>

<button id="musicBtn" aria-label="Pause music" aria-pressed="true">
  <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 3v10.55A4 4 0 1 0 14 17V7h4V3h-6z"/></svg>
</button>

<div id="lightbox" role="dialog" aria-modal="true" aria-label="Photo">
  <button aria-label="Close">✕</button>
  <figure><img alt=""><figcaption></figcaption></figure>
</div>

<audio id="bgm" src="music.mp3" loop preload="auto"></audio>

<script>
/* =====================================================================
   EDIT EVERYTHING HERE — names, message, photos and music
   ===================================================================== */
const CONFIG = {
  name: "Mama",
  introText: "a little something, for you",
  wishSubtitle: "to the most wonderful Mama in the world",
  pageTitle: "Blooming Wishes",

  galleryKicker: "then & always",
  galleryTitle: "Little Me & You",
  // Photos live in the "photos" folder. To add one, put the file there and add a line.
  // "pos" (optional) sets which part of the photo stays visible in the square-ish tile,
  // e.g. "50% 20%" keeps the top, "70% 50%" keeps the right side.
  // "caption" (optional) adds a small label under the photo.
  photos: [
    { src: "photos/1.jpg", pos: "45% 50%" },
    { src: "photos/2.jpg", pos: "50% 40%" },
    { src: "photos/3.jpg", pos: "63% 40%" },
    { src: "photos/4.jpg", pos: "50% 30%" },
    { src: "photos/5.jpg", pos: "50% 22%" },
    { src: "photos/6.jpg", pos: "52% 40%" },
  ],

  letterTitle: "Happy Birthday, Mama",
  letter: [
    "To the prettiest woman I could name,",
    "Happy Birthday. You are not just a woman, you are the roots of my tree—you are my mother.",
    "Thank you for being the best despite such circumstances, that even in misery, you're just right there to offer your utmost efforts and positivity just to bring a smile on my face. You never made me feel so little and supported me in every step of my growth. I am forever grateful for your constant love mama!",
    "On this day that we celebrate your birth, with all my heart, thank you mama for simply existing. Without you, I am nothing. Happiest Birthday Mama! I love you, always!",
  ],
  signoffLine: "From your loving daughter,",
  signoffName: "Angel",

  hugButton: "Send Mama a hug ♥",
  hugReplies: ["Hug delivered ♥", "Another one! ♥♥", "Infinite hugs unlocked ♥♥♥"],

  music: "music.mp3",   // temporary track — swap for your own song
};

/* ===================================================================== */
const $ = s => document.querySelector(s);
const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;

// ---- fill text from CONFIG
document.title = `Happy Birthday, ${CONFIG.name} ♥`;
$("#introText").textContent = CONFIG.introText;
$("#wishSub").textContent = CONFIG.wishSubtitle;
$("#topbar").textContent = CONFIG.pageTitle;
$("#heroTo").textContent = `${CONFIG.name} ♥`;
$("#galleryKicker").textContent = CONFIG.galleryKicker;
$("#galleryTitle").textContent = CONFIG.galleryTitle;
$("#letterTitle").textContent = CONFIG.letterTitle;
$("#letterBody").innerHTML = "";
CONFIG.letter.forEach(line => { const p = document.createElement("p"); p.textContent = line; $("#letterBody").appendChild(p); });
$("#signoffLine").textContent = CONFIG.signoffLine;
$("#signoffName").textContent = CONFIG.signoffName;
$("#hugBtn").textContent = CONFIG.hugButton;
$("#bgm").src = CONFIG.music;

// ---- placeholder photos
const PALETTES = [["#fde2e8","#f7b9c8"],["#fdf0dc","#f5cf96"],["#f9e4ee","#e8b3cc"],["#fbe9e1","#f2b8a6"],["#f6ead9","#e9c99a"],["#fde6ea","#f1a7b8"]];
function placeholder(i){
  const [a,b] = PALETTES[i % PALETTES.length];
  const svg = `<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 400 500'>
    <defs><linearGradient id='g' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='${a}'/><stop offset='1' stop-color='${b}'/></linearGradient></defs>
    <rect width='400' height='500' fill='url(#g)'/>
    <rect x='18' y='18' width='364' height='464' rx='18' fill='none' stroke='#fff' stroke-opacity='.8' stroke-width='3' stroke-dasharray='10 10'/>
    <path transform='translate(200 215) scale(1.1)' d='M0 -22 C -8 -46 -52 -48 -52 -10 C -52 16 -22 34 0 52 C 22 34 52 16 52 -10 C 52 -48 8 -46 0 -22 Z' fill='#fff' fill-opacity='.85'/>
    <text x='200' y='330' text-anchor='middle' font-family='Georgia,serif' font-style='italic' font-size='30' fill='#8c4f5c'>Photo ${i+1}</text>
    <text x='200' y='368' text-anchor='middle' font-family='Georgia,serif' font-style='italic' font-size='20' fill='#8c4f5c' fill-opacity='.75'>your picture goes here</text>
  </svg>`;
  return "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svg);
}
const grid = $("#grid");
CONFIG.photos.forEach((ph, i) => {
  const fig = document.createElement("figure");
  fig.className = "ph";
  fig.tabIndex = 0;
  const src = ph.src || placeholder(i);
  fig.innerHTML = `<div class="frame"><img loading="lazy" alt=""></div>`;
  const img = fig.querySelector("img");
  img.src = src;
  img.alt = ph.caption || `Photo ${i+1} of Mama and me`;
  if (ph.pos) img.style.objectPosition = ph.pos;
  if (ph.caption){ const cap = document.createElement("figcaption"); cap.textContent = ph.caption; fig.appendChild(cap); }
  const open = () => openLightbox(src, ph.caption);
  fig.addEventListener("click", open);
  fig.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); open(); } });
  grid.appendChild(fig);
});

// ---- lightbox
const lb = $("#lightbox");
function openLightbox(src, cap){ lb.querySelector("img").src = src; lb.querySelector("figcaption").textContent = cap || ""; lb.classList.add("open"); lb.querySelector("button").focus(); }
function closeLightbox(){ lb.classList.remove("open"); }
lb.addEventListener("click", e => { if (e.target === lb || e.target.tagName === "BUTTON") closeLightbox(); });
addEventListener("keydown", e => { if (e.key === "Escape") closeLightbox(); });

// ---- music
const bgm = $("#bgm"), musicBtn = $("#musicBtn");
function fadeTo(vol, ms){
  const start = bgm.volume, t0 = performance.now();
  (function step(now){ const p = Math.min(1,(now-t0)/ms); bgm.volume = start + (vol-start)*p; if (p<1) requestAnimationFrame(step); })(t0);
}
function startMusic(){
  try { bgm.volume = 0; const pr = bgm.play(); if (pr) pr.then(() => { fadeTo(.7, 2500); setMusicUI(true); }).catch(() => setMusicUI(false)); }
  catch(e){ setMusicUI(false); }
  musicBtn.classList.add("show");
}
function setMusicUI(on){ musicBtn.classList.toggle("playing", on); musicBtn.setAttribute("aria-pressed", on); musicBtn.setAttribute("aria-label", on ? "Pause music" : "Play music"); musicBtn.style.opacity = on ? 1 : .6; }
musicBtn.addEventListener("click", () => {
  if (bgm.paused) { bgm.play().then(() => { fadeTo(.7, 600); setMusicUI(true); }).catch(()=>{}); }
  else { bgm.pause(); setMusicUI(false); }
});

// ---- flying hearts burst (used by the heart and the hug button)
function burst(x, y, n = 18, spread = 160){
  const glyphs = ["♥","♥","♥","✦"], colors = ["#e8546f","#f27896","#f3a5b9","#e9b85d","#d93c5b"];
  for (let i = 0; i < n; i++){
    const el = document.createElement("span");
    el.className = "fly"; el.textContent = glyphs[i % glyphs.length];
    el.style.left = x + "px"; el.style.top = y + "px"; el.style.color = colors[i % colors.length];
    el.style.fontSize = (12 + Math.random()*18) + "px";
    document.body.appendChild(el);
    const a = Math.random()*Math.PI*2, d = spread*(.4+Math.random()*.8);
    const dx = Math.cos(a)*d, dy = Math.sin(a)*d - 60;
    el.animate([
      { transform:"translate(-50%,-50%) scale(.3)", opacity:1 },
      { transform:`translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px)) scale(1) rotate(${(Math.random()-.5)*60}deg)`, opacity:1, offset:.6 },
      { transform:`translate(calc(-50% + ${dx*1.1}px), calc(-50% + ${dy+70}px)) scale(.8)`, opacity:0 }
    ], { duration: 1300 + Math.random()*700, easing:"cubic-bezier(.2,.7,.3,1)" }).onfinish = () => el.remove();
  }
}

/* =====================================================================
   SEQUENCE: heart → make a wish → blooming tree
   ===================================================================== */
const heartBtn = $("#heartBtn"), intro = $("#intro"), wish = $("#wish"), flash = $("#flash");
let stage = 0;

heartBtn.addEventListener("click", () => {
  if (stage) return; stage = 1;
  startMusic();
  const r = heartBtn.getBoundingClientRect();
  const cx = r.left + r.width/2, cy = r.top + r.height/2;
  burst(cx, cy, 22, 180);
  heartBtn.classList.add("dropping");
  wish.style.setProperty("--cx", cx + "px");
  wish.style.setProperty("--cy", (cy + innerHeight*0.2) + "px");
  setTimeout(() => { wish.classList.add("open", "play"); }, 750);
  setTimeout(() => { intro.style.display = "none"; }, 1900);
  wishTimer = setTimeout(toMain, 7500);
});

let wishTimer;
wish.addEventListener("click", () => { if (stage === 1 && wish.classList.contains("play")) toMain(); });

function toMain(){
  if (stage !== 1) return; stage = 2;
  clearTimeout(wishTimer);
  flash.classList.add("on");
  setTimeout(() => {
    wish.style.display = "none"; intro.style.display = "none";
    document.body.classList.add("unlocked");
    scrollTo(0, 0);
    startPetals();
    startTree();
    flash.classList.add("fade"); flash.classList.remove("on");
  }, 550);
}

/* =====================================================================
   HEART TREE
   ===================================================================== */
const HEART = new Path2D("M0 -0.22 C -0.08 -0.46 -0.52 -0.48 -0.52 -0.1 C -0.52 0.16 -0.22 0.34 0 0.52 C 0.22 0.34 0.52 0.16 0.52 -0.1 C 0.52 -0.48 0.08 -0.46 0 -0.22 Z");
function mulberry32(a){ return function(){ a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const easeOut = p => 1 - Math.pow(1-p, 3);
const easeBack = p => { const c1 = 1.9, c3 = c1 + 1; return 1 + c3*Math.pow(p-1,3) + c1*Math.pow(p-1,2); };

const treeCv = $("#tree"), tctx = treeCv.getContext("2d");
const T = { W:0, H:0, segs:[], hearts:[], growEnd:0, bloomEnd:0, t0:0, visible:true, running:false };

function buildTree(){
  const dpr = Math.min(devicePixelRatio || 1, 2);
  const cssW = treeCv.clientWidth || 400;
  const W = cssW, H = cssW * 1.15;
  treeCv.width = Math.round(W*dpr); treeCv.height = Math.round(H*dpr);
  tctx.setTransform(dpr,0,0,dpr,0,0);
  T.W = W; T.H = H;
  const rng = mulberry32(20261108);

  // heart-shaped crown
  const cx = W/2, k = W*0.298, cy = W*0.70 - k;
  const inHeart = (px, py, g = 1) => { const x = (px-cx)/(k*g), y = (cy-py)/(k*g); return Math.pow(x*x + y*y - 1, 3) - x*x*y*y*y <= 0; };

  // branches
  const segs = [];
  const baseX = W/2, topY = H*0.62;
  segs.push({ x1:baseX, y1:H, x2:baseX, y2:topY, w:W*0.036, start:0, dur:.75, trunk:true });
  function grow(x, y, ang, len, w, depth, start){
    if (depth > 8 || len < W*0.01) return;
    const x2 = x + Math.cos(ang)*len, y2 = y + Math.sin(ang)*len;
    if (depth >= 1 && !inHeart(x2, y2, 0.97)) return;
    const dur = .3;
    segs.push({ x1:x, y1:y, x2, y2, w, start, dur });
    const n = depth < 2 ? 2 : (rng() < .22 ? 3 : 2);
    for (let i = 0; i < n; i++){
      let a;
      if (depth === 0) a = ang + (i ? 1 : -1) * (.62 + rng()*.1);
      else if (n === 2) a = ang + (i ? 1 : -1) * (.3 + rng()*.28);
      else a = ang + (i - 1) * (.34 + rng()*.15);
      a = a*.92 + (-Math.PI/2)*.08; // gentle upward pull
      grow(x2, y2, a, len*(.76 + rng()*.1), w*.7, depth+1, start + dur*.82);
    }
  }
  grow(baseX, topY, -Math.PI/2, W*0.15, W*0.026, 0, .62);
  T.segs = segs;
  T.growEnd = Math.max(...segs.map(s => s.start + s.dur));

  // heart leaves
  const hearts = [];
  const top = cy - 1.25*k, bottom = cy + k;
  const COLS = ["#f39ab2","#ee7d9b","#f6b8c8","#e9607f","#f8c9d4","#f3a0b5","#f2c069","#f5d28d","#eeb15a"];
  const count = Math.round(W > 380 ? 300 : 230);
  let guard = 0;
  while (hearts.length < count && guard++ < 20000){
    const px = cx + (rng()*2 - 1) * 1.14*k, py = top + rng()*(bottom - top);
    if (!inHeart(px, py, 1)) continue;
    const s = W*(0.042 + rng()*0.036);
    const yN = (py - top) / (bottom - top);
    hearts.push({
      x:px, y:py, s, color: COLS[Math.floor(rng()*COLS.length)],
      rot:(rng()-.5)*0.7, phase:rng()*Math.PI*2,
      delay: T.growEnd - .2 + (1 - yN)*1.9 + rng()*.7,
    });
  }
  hearts.sort((a,b) => a.s - b.s);
  T.hearts = hearts;
  T.bloomEnd = Math.max(...hearts.map(h => h.delay)) + .5;
}

function drawTree(t){
  const { W, H } = T;
  tctx.clearRect(0, 0, W, H);
  // ground shadow
  const g = tctx.createRadialGradient(W/2, H-4, 2, W/2, H-4, W*.22);
  g.addColorStop(0, "rgba(150,70,80,.18)"); g.addColorStop(1, "rgba(150,70,80,0)");
  tctx.fillStyle = g; tctx.fillRect(W*.25, H-30, W*.5, 30);

  tctx.lineCap = "round";
  for (const s of T.segs){
    const p = Math.max(0, Math.min(1, (t - s.start)/s.dur));
    if (p <= 0) continue;
    const e = easeOut(p);
    tctx.strokeStyle = s.trunk ? "#a65e6b" : "#b56f7b";
    tctx.lineWidth = Math.max(1, s.w);
    tctx.beginPath(); tctx.moveTo(s.x1, s.y1);
    tctx.lineTo(s.x1 + (s.x2-s.x1)*e, s.y1 + (s.y2-s.y1)*e);
    tctx.stroke();
  }
  for (const h of T.hearts){
    const p = Math.max(0, Math.min(1, (t - h.delay)/.5));
    if (p <= 0) continue;
    const sc = h.s * easeBack(p);
    const sway = Math.sin(t*1.3 + h.phase) * .07;
    tctx.save();
    tctx.translate(h.x, h.y); tctx.rotate(h.rot + sway); tctx.scale(sc, sc);
    tctx.globalAlpha = Math.min(1, p*2) * .96;
    tctx.fillStyle = h.color; tctx.fill(HEART);
    tctx.globalAlpha *= .5; tctx.fillStyle = "#fff";
    tctx.beginPath(); tctx.ellipse(-.22, -.2, .12, .07, -.6, 0, Math.PI*2); tctx.fill();
    tctx.restore();
  }
}

function startTree(){
  buildTree();
  T.t0 = performance.now() - (reduceMotion ? (T.bloomEnd*1000) : 0);
  T.running = true;
  let last = 0, shownScript = false;
  function frame(now){
    const t = (now - T.t0)/1000;
    if (!shownScript && t > T.growEnd + .6){ shownScript = true; $("#heroScript").classList.add("show"); }
    if (t > T.bloomEnd + .3) $("#scrollCue").classList.add("show");
    // after blooming, redraw at ~30fps and only when visible
    if (T.visible && (t < T.bloomEnd + .5 || now - last > 33)){ drawTree(t); last = now; }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
  new IntersectionObserver(es => { T.visible = es[0].isIntersecting; }).observe(treeCv);
}

let lastW = innerWidth;
addEventListener("resize", () => {
  if (!T.running || Math.abs(innerWidth - lastW) < 40) return;
  lastW = innerWidth;
  const t = (performance.now() - T.t0)/1000;
  buildTree();
  T.t0 = performance.now() - Math.max(t, T.bloomEnd)*1000;
});

/* =====================================================================
   FALLING PETALS
   ===================================================================== */
const pc = $("#petals"), pctx = pc.getContext("2d");
let petals = [];
function sizePetals(){ const d = Math.min(devicePixelRatio||1, 2); pc.width = innerWidth*d; pc.height = innerHeight*d; pctx.setTransform(d,0,0,d,0,0); }
function startPetals(){
  sizePetals(); addEventListener("resize", sizePetals);
  const n = reduceMotion ? 8 : Math.round(Math.min(34, innerWidth/40));
  const cols = ["#f3a0b5","#ee7d9b","#f6c3cf","#f2c069","#f8d6a0"];
  petals = Array.from({length:n}, () => ({
    x: Math.random()*innerWidth, y: Math.random()*innerHeight - innerHeight,
    s: 8 + Math.random()*12, vy: 14 + Math.random()*26, sw: 18 + Math.random()*30,
    ph: Math.random()*6.28, rot: Math.random()*6.28, vr: (Math.random()-.5)*.8,
    c: cols[Math.floor(Math.random()*cols.length)], a: .35 + Math.random()*.4
  }));
  let prev = performance.now();
  (function tick(now){
    const dt = Math.min(.05, (now - prev)/1000); prev = now;
    pctx.clearRect(0, 0, innerWidth, innerHeight);
    for (const p of petals){
      p.y += p.vy*dt; p.ph += dt*.9; p.rot += p.vr*dt;
      if (p.y > innerHeight + 20){ p.y = -20; p.x = Math.random()*innerWidth; }
      const x = p.x + Math.sin(p.ph)*p.sw;
      pctx.save(); pctx.translate(x, p.y); pctx.rotate(p.rot); pctx.scale(p.s, p.s);
      pctx.globalAlpha = p.a; pctx.fillStyle = p.c; pctx.fill(HEART); pctx.restore();
    }
    requestAnimationFrame(tick);
  })(prev);
}

/* =====================================================================
   SCROLL REVEALS + HUG BUTTON
   ===================================================================== */
const io = new IntersectionObserver(es => es.forEach(e => {
  if (!e.isIntersecting) return;
  e.target.classList.add("in");
  if (e.target.id === "letter"){
    [...e.target.querySelectorAll("#letterBody p, .signoff")].forEach((p, i) => {
      p.animate([{opacity:0, transform:"translateY(10px)"},{opacity:1, transform:"none"}],
        {duration:900, delay: 300 + i*450, fill:"both", easing:"ease-out"});
    });
  }
  io.unobserve(e.target);
}), { threshold:.18 });
document.querySelectorAll(".reveal-up").forEach(el => io.observe(el));

let hugs = 0;
$("#hugBtn").addEventListener("click", e => {
  const r = e.currentTarget.getBoundingClientRect();
  burst(r.left + r.width/2, r.top + r.height/2, 26, 200);
  $("#hugNote").textContent = CONFIG.hugReplies[Math.min(hugs, CONFIG.hugReplies.length-1)];
  hugs++;
});
</script>
